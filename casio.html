<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160624">
<title>VORX · Matrix</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vorx.css">
<style>
.lcd{flex:none;padding:10px 16px 12px;display:flex;flex-direction:column;gap:2px}
.meta{display:flex;justify-content:space-between;align-items:center;font:700 12px/1.6 'Orbitron',monospace;color:var(--mut)}
#mode{padding:1px 10px;font-size:10px;color:var(--base);background:var(--gold);border-radius:99px}
#opd{min-width:18px;text-align:right;font-size:18px;color:var(--gold)}
#main{font-family:'Orbitron','Share Tech Mono',monospace;font-weight:700;font-size:48px;line-height:1.25;text-align:right;white-space:nowrap;overflow:hidden;text-shadow:0 0 14px rgba(240,185,11,.28)}
.ctl{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl button{padding:10px 2px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--txt);background:var(--glass);border:1px solid var(--line);border-radius:16px 6px 16px 6px;transition:transform .1s}
.ctl button:active{transform:scale(.94)}.ctl .cc{color:var(--gold)}
.pad4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px}
.ck{font-size:22px;font-weight:800;color:var(--txt);background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:22px 9px 22px 9px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .1s,background .15s}
.ck:nth-child(2n){border-radius:9px 22px 9px 22px}.ck:active{transform:scale(.93);background:rgba(240,185,11,.3)}
.ck.op{color:#f08cff;background:linear-gradient(145deg,rgba(217,2,238,.3),rgba(22,6,36,.4));border-color:rgba(217,2,238,.42)}
.ck.ac{color:#fda4af;background:linear-gradient(145deg,rgba(251,113,133,.3),rgba(22,6,36,.4));border-color:rgba(251,113,133,.42)}
.ck.eq{color:#1a1200;background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 8px 20px rgba(240,185,11,.3)}
#hs{position:fixed;inset:0;z-index:65;background:rgba(10,2,18,.4);opacity:0;visibility:hidden;transition:.3s}
#hist{position:fixed;z-index:70;left:0;right:0;bottom:0;max-height:72dvh;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(22,6,36,.88);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1.5px solid rgba(240,185,11,.4);border-radius:28px 28px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility 0s .35s}
.hist-open #hist{transform:none;visibility:visible;transition-delay:0s}.hist-open #hs{opacity:1;visibility:visible}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hh b{font-size:13px;letter-spacing:.14em;color:var(--gold)}.hh span{display:flex;gap:8px}
#list{overflow:auto;overscroll-behavior:contain}
.row{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .e{font:13px/1.4 monospace;color:var(--mut)}.row .r{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:800}.row small{font-size:11px;font-weight:600;color:var(--mut)}
.empty{padding:28px 0;text-align:center;color:var(--mut)}
</style>
<script src="vorx.js"></script>
</head>
<body class="fit" data-page="casio" data-title="Matrix">
<main class="wrap">
  <section class="card lcd" aria-live="polite">
    <div class="meta"><span id="step">00</span><span id="mode" class="hide">REV</span><span id="opd"></span></div>
    <div id="main">0</div>
  </section>
  <div class="ctl">
    <button data-c="prev">◀ PREV</button><button data-c="next">NEXT ▶</button><button data-c="list">LIST</button><button class="cc" data-c="corr">CORR</button>
  </div>
  <div class="pad4" id="keys"></div>
</main>
<div id="hs"></div>
<div id="hist" role="dialog" aria-label="History">
  <div class="hh"><b>HISTORY TAPE</b><span><button class="pill clr" id="hclr">Clear</button><button class="pill done" id="hx">Close</button></span></div>
  <div id="list"></div>
</div>

<script>
(() => {
  'use strict';
  const { $, store, buzz, toast } = VORX, MAX = 12;
  let tape = store.get('casio', null);
  if (!Array.isArray(tape)) { try { tape = JSON.parse(localStorage.getItem('casio_data') || '[]') || []; } catch (e) { tape = []; } }  // also picks up the old app's history
  const chainOf = t => Array.isArray(t) ? t : t.chain, tsOf = t => Array.isArray(t) ? null : t.ts;
  let chain = [], input = '0', idx = -1, edit = false, resShown = false, isNew = false, total = 0, fromTape = false, err = false;
  const clean = n => +n.toPrecision(12);
  const SYM = { '*': '×', '/': '÷', '-': '−', '+': '+', '%': '%', '=': '=' };
  const apply = (t, o, v) => o === '+' ? t + v : o === '-' ? t - v : o === '*' ? t * v : o === '/' ? (v === 0 ? NaN : t / v) : o === '%' ? t * v / 100 : t;
  const save = () => store.set('casio', tape);
  const fmtN = s => { const n = parseFloat(s); return isNaN(n) ? '0' : n.toLocaleString('en-IN', { maximumFractionDigits: 10 }); };

  function reset() { chain = []; input = '0'; idx = -1; edit = false; resShown = false; isNew = false; total = 0; err = false; fromTape = false; }
  function exitReview() { if (idx === -1) return; idx = -1; if (fromTape) { chain = []; fromTape = false; } }
  function fail() { err = true; render(); }

  function num(n) {
    if (err) reset();
    if (!edit) exitReview();
    const first = n === '.' ? '0.' : n === '00' ? '0' : n;
    if (resShown) { reset(); input = first; return render(); }
    if (isNew) { input = first; isNew = false; }
    else {
      if (input.replace(/[.-]/g, '').length >= MAX) return;
      if (n === '.') { if (input.includes('.')) return; input += '.'; }
      else if (input === '0') input = first; else input += n;
    }
    render();
  }
  function op(o) {
    if (edit) return; if (err) reset();
    exitReview();
    const v = parseFloat(input) || 0;
    if (!chain.length) total = v; else if (!isNew) total = clean(apply(total, chain[chain.length - 1].o, v));
    if (!isFinite(total)) return fail();
    if (isNew && chain.length) chain[chain.length - 1].o = o; else chain.push({ v: input, o });
    input = String(total); isNew = true; resShown = false; render();
  }
  function eq() {
    if (edit) return finishCorr(); if (err) return;
    exitReview();
    if (!chain.length) return;
    const t = clean(apply(total, chain[chain.length - 1].o, parseFloat(input) || 0));
    if (!isFinite(t)) return fail();
    chain.push({ v: input, o: '=' }, { v: String(t), o: 'ANS' });
    tape.push({ chain: JSON.parse(JSON.stringify(chain)), ts: Date.now() }); save();
    input = String(t); resShown = true; isNew = true; chain = []; total = 0; render(); renderList();
  }
  function del() {
    if (err) { reset(); return render(); }
    if (!edit && (resShown || isNew || idx !== -1)) return;
    input = input.slice(0, -1) || '0'; render();
  }
  function prev() {
    if (edit) return;
    if (idx === -1) {
      if (chain.length) idx = chain.length - 1;
      else if (tape.length) { chain = JSON.parse(JSON.stringify(chainOf(tape[tape.length - 1]))); fromTape = true; idx = chain.length - 1; }
    } else if (idx > 0) idx--;
    render();
  }
  function next() { if (edit || idx === -1) return; if (idx < chain.length - 1) idx++; else exitReview(); render(); }
  function corr() {
    if (idx === -1 || !fromTape) return toast('Open a finished calculation with PREV first');
    if (chain[idx].o === 'ANS') return toast('Pick a step to correct');
    edit = true; input = chain[idx].v; isNew = true; render();
  }
  function finishCorr() {
    chain[idx].v = input;
    const items = chain.filter(c => c.o !== 'ANS'); let t = parseFloat(items[0].v) || 0;
    for (let i = 1; i < items.length; i++) t = clean(apply(t, items[i - 1].o, parseFloat(items[i].v) || 0));
    edit = false; idx = -1; chain = []; fromTape = false;
    if (!isFinite(t)) return fail();
    tape[tape.length - 1] = { chain: items.concat({ v: String(t), o: 'ANS' }), ts: Date.now() }; save();
    input = String(t); resShown = true; isNew = true; render(); renderList();
  }

  function render() {
    let v = input, o = '', step = 0, mode = '';
    if (edit) { o = 'EDIT'; mode = 'CRT'; step = idx + 1; }
    else if (idx !== -1) { const it = chain[idx]; v = it.v; o = it.o === 'ANS' ? '=' : it.o; mode = 'REV'; step = idx + 1; }
    else { if (chain.length && !resShown) o = chain[chain.length - 1].o; step = chain.length + (isNew ? 0 : 1); }
    const raw = edit || (idx === -1 && !resShown && !isNew), m = $('#main');
    m.textContent = err ? 'Error' : raw ? v : fmtN(v);
    $('#opd').textContent = SYM[o] || o;
    $('#step').textContent = String(step).padStart(2, '0');
    const md = $('#mode'); md.textContent = mode; md.classList.toggle('hide', !mode);
    let s = 48; m.style.fontSize = s + 'px';
    while (m.scrollWidth > m.clientWidth && s > 20) { s -= 2; m.style.fontSize = s + 'px'; }
  }
  function renderList() {
    const el = $('#list');
    if (!tape.length) { el.innerHTML = '<div class="empty">No history yet</div>'; return; }
    el.innerHTML = tape.map((entry, i) => {
      const t = chainOf(entry), ts = tsOf(entry), ans = t.find(x => x.o === 'ANS'), res = ans ? ans.v : '0';
      const expr = t.filter(c => c.o !== 'ANS').map(c => c.v + (c.o === '=' ? '' : ' ' + (SYM[c.o] || c.o) + ' ')).join('');
      const when = ts ? new Date(ts).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="row" data-i="${i}"><div class="e">${expr} =</div><div class="r"><span>${fmtN(res)}</span><small>${when}</small></div></div>`;
    }).reverse().join('');
  }

  const KEYS = [['ac', 'AC', 'ac'], ['del', '⌫', 'op'], ['%', '%', 'op'], ['/', '÷', 'op'], ['7'], ['8'], ['9'], ['*', '×', 'op'], ['4'], ['5'], ['6'], ['-', '−', 'op'], ['1'], ['2'], ['3'], ['+', '+', 'op'], ['00'], ['0'], ['.'], ['=', '=', 'eq']];
  $('#keys').innerHTML = KEYS.map(k => `<button class="ck ${k[2] || ''}" data-k="${k[0]}" aria-label="${k[1] || k[0]}">${k[1] || k[0]}</button>`).join('');
  function key(k) {
    buzz(8);
    if (k === 'ac') { reset(); render(); } else if (k === 'del') del(); else if (k === '=') eq();
    else if ('+-*/%'.includes(k)) op(k); else num(k);
  }
  const setHist = o => document.body.classList.toggle('hist-open', o);
  let armed = 0;
  document.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'), c = e.target.closest('[data-c]'), r = e.target.closest('.row');
    if (k && k.closest('#keys')) key(k.dataset.k);
    if (c) { buzz(8); ({ prev, next, corr, list: () => setHist(true) })[c.dataset.c](); }
    if (r) { const t = chainOf(tape[+r.dataset.i]), a = t.find(x => x.o === 'ANS'); reset(); input = a ? a.v : '0'; resShown = true; isNew = true; render(); setHist(false); }
  });
  $('#hs').onclick = $('#hx').onclick = () => setHist(false);
  $('#hclr').onclick = e => {
    if (Date.now() - armed < 3000) { tape = []; save(); renderList(); e.target.textContent = 'Clear'; armed = 0; return; }
    armed = Date.now(); e.target.textContent = 'Tap again';
    setTimeout(() => { if (Date.now() - armed >= 2900) e.target.textContent = 'Clear'; }, 3000);
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea')) return;
    const k = e.key;
    if (/^[0-9.]$/.test(k)) key(k); else if ('+-*/%'.includes(k) && k.length === 1) key(k);
    else if (k === 'Enter' || k === '=') key('='); else if (k === 'Backspace') key('del'); else if (k === 'Escape') key('ac');
  });
  render(); renderList();
})();
</script>
</body>
</html>
