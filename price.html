<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160624">
<title>VORX · Valuer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vorx.css">
<script src="vorx.js"></script>
</head>
<body class="fit" data-page="price" data-title="Valuer">
<main class="wrap mid">
  <section class="grand">
    <span class="lbl">TOTAL<br>PRICE</span>
    <input class="in" id="tp" readonly inputmode="none" aria-label="Total price" value="0.00">
  </section>
  <section class="card cardf">
    <div>
      <label class="lbl" for="pv">Price per vori (Tk)</label>
      <input class="in big" id="pv" data-pad="Price per vori (Tk)" inputmode="none" autocomplete="off" placeholder="200000">
    </div>
    <div>
      <label class="lbl" for="wg">Weight (grams)</label>
      <input class="in big" id="wg" data-pad="Weight (grams)" inputmode="none" autocomplete="off" placeholder="50">
    </div>
    <div class="g2">
      <div class="tile tall"><small>Weight in vori</small><div class="v" id="tv">0.0000</div></div>
      <div class="tile tall"><small>Price per gram</small><div class="v" id="pg">0.00</div></div>
    </div>
  </section>
  <p class="note">Total = (grams ÷ 11.664) × price per vori</p>
</main>
<script>
(() => {
  const { $, store, fmt } = VORX;
  const G = 11.664, S = store.get('price', {});
  const N = id => parseFloat($('#' + id).value) || 0;
  $('#pv').value = S.pv || ''; $('#wg').value = S.wg || '';
  function calc() {
    const p = N('pv'), vori = N('wg') / G;
    $('#tp').value = fmt(vori * p); $('#tv').textContent = vori.toFixed(4); $('#pg').textContent = fmt(p / G);
  }
  document.addEventListener('input', e => {
    if (e.target.id === 'pv' || e.target.id === 'wg') { S[e.target.id] = e.target.value; store.set('price', S); }
    calc();
  });
  calc();
})();
</script>
</body>
</html>
